    /* SQL Schema & DBMS Academic Reference Modal */
    function openSqlSchemaModal() {
      var activeDocTab = "ddl";
      function renderSqlModal() {
        var bodyContent = "";
        if (activeDocTab === "ddl") {
          bodyContent =
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
              '<span class="field-hint">Normalized 3NF SQL DDL preserving all 8 entities, PKs, and Foreign Keys:</span>' +
              '<button type="button" class="btn btn-secondary btn-sm" id="copy-sql-btn">Copy SQL DDL</button>' +
            '</div>' +
            '<pre class="sql-pre">' + esc(SQL_SCHEMA_TEXT) + '</pre>';
        } else if (activeDocTab === "er") {
          bodyContent =
            '<div class="table-wrap"><table><thead><tr><th>Entity Table</th><th>Primary Key</th><th>Foreign Keys &amp; Cardinality</th></tr></thead><tbody>' +
              '<tr><td class="mono">DEPARTMENT</td><td class="mono">dept_id</td><td>1:N to SERVICE_CATEGORY, 1:N to STAFF</td></tr>' +
              '<tr><td class="mono">SERVICE_CATEGORY</td><td class="mono">category_id</td><td>FK: dept_id &rarr; DEPARTMENT · 1:N to TICKET</td></tr>' +
              '<tr><td class="mono">ADMIN</td><td class="mono">admin_id</td><td>1:N to ASSIGNMENT</td></tr>' +
              '<tr><td class="mono">STAFF</td><td class="mono">staff_id</td><td>FK: dept_id &rarr; DEPARTMENT · 1:N to ASSIGNMENT</td></tr>' +
              '<tr><td class="mono">STUDENT</td><td class="mono">student_id</td><td>1:N to TICKET, 1:N to FEEDBACK</td></tr>' +
              '<tr><td class="mono">TICKET</td><td class="mono">ticket_id</td><td>FK: student_id &rarr; STUDENT, category_id &rarr; SERVICE_CATEGORY</td></tr>' +
              '<tr><td class="mono">ASSIGNMENT</td><td class="mono">assignment_id</td><td>FK: ticket_id &rarr; TICKET, staff_id &rarr; STAFF, admin_id &rarr; ADMIN</td></tr>' +
              '<tr><td class="mono">FEEDBACK</td><td class="mono">feedback_id</td><td>FK: ticket_id (UNIQUE) &rarr; TICKET, student_id &rarr; STUDENT</td></tr>' +
            '</tbody></table></div>';
        } else {
          bodyContent =
            '<div class="notice notice-info" style="margin-bottom:14px;">' +
              icon("database", 18) +
              '<div><strong>Browser localStorage vs. Relational SQL RDBMS:</strong><br/>This single-file HTML5 demonstration stores normalized JSON collections in <span class="mono">window.localStorage</span> so it runs offline without installation or a server.</div>' +
            '</div>' +
            '<ul style="padding-left:20px;color:var(--text-secondary);font-size:0.9rem;display:flex;flex-direction:column;gap:8px;">' +
              '<li><strong>Not a Real SQL Engine:</strong> localStorage is single-browser key-value persistence without ACID row locking, concurrent multi-user synchronization, or database-enforced foreign key cascades.</li>' +
              '<li><strong>Demo Authentication Boundary:</strong> Client-side role logins are academic workflow demonstrations and do not provide production cryptographic security.</li>' +
              '<li><strong>Production Upgrade Path:</strong> Deploying for a live university requires a server API (Node/Python/Java) connected to MySQL or PostgreSQL executing the SQL DDL shown in the first tab.</li>' +
            '</ul>';
        }

        document.getElementById("modal-root").innerHTML =
          '<div class="backdrop" id="sql-backdrop"><div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="sql-modal-title">' +
            '<div class="modal-head"><h3 class="modal-title" id="sql-modal-title">DBMS Relational Schema &amp; Academic Architecture</h3><button type="button" class="btn-ghost" id="sql-close">' + icon("x", 18) + '</button></div>' +
            '<div class="modal-body">' +
              '<div class="segmented" style="margin-bottom:16px;">' +
                '<button type="button" class="seg-btn ' + (activeDocTab === "ddl" ? "active" : "") + '" data-doc-tab="ddl">SQL DDL (8 Tables)</button>' +
                '<button type="button" class="seg-btn ' + (activeDocTab === "er" ? "active" : "") + '" data-doc-tab="er">Keys &amp; Relationships</button>' +
                '<button type="button" class="seg-btn ' + (activeDocTab === "notes" ? "active" : "") + '" data-doc-tab="notes">localStorage Scope Note</button>' +
              '</div>' +
              bodyContent +
            '</div>' +
            '<div class="modal-foot"><button type="button" class="btn btn-primary" id="sql-done">Close</button></div>' +
          '</div></div>';

        document.getElementById("sql-close").onclick = closeModal;
        document.getElementById("sql-done").onclick = closeModal;
        document.getElementById("sql-backdrop").onclick = function (e) { if (e.target.id === "sql-backdrop") closeModal(); };
        var tabs = document.querySelectorAll("[data-doc-tab]");
        for (var i = 0; i < tabs.length; i++) {
          (function (btn) {
            btn.onclick = function () { activeDocTab = btn.getAttribute("data-doc-tab"); renderSqlModal(); };
          })(tabs[i]);
        }
        var copyBtn = document.getElementById("copy-sql-btn");
        if (copyBtn) {
          copyBtn.onclick = function () {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(SQL_SCHEMA_TEXT).then(function () {
                showToast("SQL DDL copied to clipboard.", "success");
              });
            } else {
              showToast("Select and copy the SQL text directly from the code box.", "info");
            }
          };
        }
      }
      renderSqlModal();
    }

    function promptResetDB() {
      openConfirmModal(
        "Reset Demo Database",
        "Restore all 8 tables in localStorage back to the initial academic sample dataset? Any newly created tickets, staff, or feedback will be cleared.",
        "Reset to Sample Data",
        "btn-danger",
        function () {
          closeDrawer();
          state.db = getSeedData();
          saveDB(state.db);
          showToast("Demo database restored to initial 8-entity sample state.", "success");
          renderApp();
        }
      );
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        if (document.getElementById("modal-root").innerHTML !== "") closeModal();
        else if (document.getElementById("drawer-root").innerHTML !== "") closeDrawer();
      }
    });

    /* Bootstrap Application */
    state.db = loadDB();
    state.session = loadSession();
    renderApp();
  })();
  </script>
