<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Service Request and Complaint Management System</title>
  <meta name="description" content="Academic DBMS project: Campus Service Request and Complaint Management System with Student, Admin, and Staff dashboards." />
  <meta property="og:title" content="Campus Service Request and Complaint Management System" />
  <meta property="og:description" content="Unified campus service request and complaint management portal built with HTML5, CSS3, and Vanilla JavaScript." />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --navy-950: #08152B;
      --navy-900: #0F2547;
      --navy-800: #163360;
      --blue-700: #1D4ED8;
      --blue-600: #2563EB;
      --blue-50: #EFF6FF;
      --bg-page: #F4F6F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-primary: #1E293B;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --success: #15803D;
      --success-bg: #F0FDF4;
      --warning: #B45309;
      --warning-bg: #FFFBEB;
      --danger: #B91C1C;
      --danger-bg: #FEF2F2;
      --info: #1D4ED8;
      --info-bg: #EFF6FF;
      --shadow-sm: 0 1px 2px rgba(15, 37, 71, 0.05);
      --shadow-md: 0 4px 14px rgba(15, 37, 71, 0.08);
      --shadow-lg: 0 12px 32px rgba(8, 21, 43, 0.14);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--blue-600);
      outline-offset: 2px;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      min-height: 40px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease), transform 120ms var(--ease);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-sm {
      min-height: 34px;
      padding: 6px 12px;
      font-size: 0.8125rem;
    }

    .btn-primary {
      background-color: var(--navy-900);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--navy-800);
    }

    .btn-blue {
      background-color: var(--blue-700);
      color: #FFFFFF;
    }

    .btn-blue:hover {
      background-color: var(--blue-600);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
    }

    .btn-secondary:hover {
      background-color: var(--bg-subtle);
      border-color: var(--navy-900);
    }

    .btn-success {
      background-color: var(--success);
      color: #FFFFFF;
    }

    .btn-success:hover {
      background-color: #166534;
    }

    .btn-danger {
      background-color: var(--danger);
      color: #FFFFFF;
    }

    .btn-danger:hover {
      background-color: #991B1B;
    }

    .btn-ghost {
      color: var(--text-secondary);
      padding: 8px 12px;
    }

    .btn-ghost:hover {
      background-color: var(--bg-subtle);
      color: var(--navy-900);
    }

    /* Landing Navigation (3-zone contract) */
    .landing-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .landing-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--navy-900);
      letter-spacing: -0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .landing-nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .landing-nav a,
    .landing-nav button {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
      transition: color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .landing-nav a:hover,
    .landing-nav button:hover {
      color: var(--navy-900);
      border-bottom-color: var(--blue-700);
    }

    /* Hero Section */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 28px;
    }

    .hero-section {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 56px 0 48px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 48px;
      align-items: stretch;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-kicker {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--blue-700);
      margin-bottom: 14px;
      letter-spacing: 0.01em;
    }

    .hero-title {
      font-size: clamp(2rem, 3.6vw, 3.125rem);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.025em;
      color: var(--navy-900);
      text-wrap: balance;
      margin-bottom: 18px;
    }

    .hero-desc {
      font-size: 1.0625rem;
      color: var(--text-secondary);
      max-width: 56ch;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .hero-meta-line {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 0.8125rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .hero-visual {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .hero-visual svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius-sm);
    }

    /* Live Metric Strip */
    .metrics-strip {
      background-color: var(--navy-900);
      color: #FFFFFF;
      padding: 24px 0;
    }

    .metrics-strip-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .strip-item {
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      padding-right: 20px;
    }

    .strip-item:last-child {
      border-right: none;
      padding-right: 0;
    }

    .strip-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .strip-label {
      font-size: 0.8125rem;
      color: #CBD5E1;
    }

    /* Landing Sections */
    .section {
      padding: 64px 0;
    }

    .section-white {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .section-header {
      max-width: 680px;
      margin-bottom: 36px;
    }

    .section-kicker {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--blue-700);
      margin-bottom: 8px;
    }

    .section-title {
      font-size: clamp(1.5rem, 2.5vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--navy-900);
      margin-bottom: 10px;
      text-wrap: balance;
    }

    .section-subtitle {
      font-size: 0.9375rem;
      color: var(--text-secondary);
    }

    /* Role Portals Grid */
    .portals-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .portal-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
    }

    .portal-card:hover {
      border-color: var(--blue-700);
      box-shadow: var(--shadow-md);
    }

    .portal-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background-color: var(--blue-50);
      color: var(--navy-900);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .portal-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--navy-900);
      margin-bottom: 8px;
    }

    .portal-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }

    .portal-list {
      list-style: none;
      margin-bottom: 24px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .portal-list li {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      padding: 5px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Features Asymmetric Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .bento-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
    }

    .bento-span-2 {
      grid-column: span 2;
    }

    .bento-num {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--blue-700);
      margin-bottom: 10px;
    }

    .bento-title {
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--navy-900);
      margin-bottom: 8px;
    }

    .bento-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .entity-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .entity-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .entity-name {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--navy-900);
    }

    .entity-key {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* How It Works */
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .step-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
    }

    .step-index {
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--blue-700);
      margin-bottom: 12px;
    }

    .step-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy-900);
      margin-bottom: 8px;
    }

    .step-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* Footer */
    .landing-footer {
      background-color: var(--navy-950);
      color: #E2E8F0;
      padding: 48px 0 32px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1.2fr;
      gap: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .footer-title {
      font-size: 1rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 12px;
    }

    .footer-text {
      font-size: 0.8125rem;
      color: #94A3B8;
      line-height: 1.6;
    }

    .footer-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-links button,
    .footer-links a {
      font-size: 0.8125rem;
      color: #CBD5E1;
      text-align: left;
      transition: color 150ms var(--ease);
    }

    .footer-links button:hover,
    .footer-links a:hover {
      color: #FFFFFF;
      text-decoration: underline;
    }

    .footer-bottom {
      padding-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      color: #94A3B8;
    }

    /* Dashboard App Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
      background-color: var(--bg-page);
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background-color: var(--navy-900);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--navy-950);
    }

    .sidebar-brand {
      padding: 20px 20px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .sidebar-brand-name {
      font-size: 0.9375rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }

    .sidebar-role {
      font-size: 0.75rem;
      color: #93C5FD;
      margin-top: 3px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      color: #CBD5E1;
      text-align: left;
      transition: background-color 150ms var(--ease), color 150ms var(--ease);
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
    }

    .nav-item.active {
      background-color: var(--blue-700);
      color: #FFFFFF;
      font-weight: 600;
    }

    .nav-count {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #CBD5E1;
    }

    .nav-item.active .nav-count {
      color: #FFFFFF;
    }

    .sidebar-footer {
      padding: 14px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      align-items: center;
      justify-content: center;
      color: var(--navy-900);
    }

    .breadcrumb {
      font-size: 0.875rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breadcrumb strong {
      color: var(--navy-900);
      font-weight: 600;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .user-summary {
      text-align: right;
      line-height: 1.3;
    }

    .user-summary-name {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--navy-900);
    }

    .user-summary-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .workspace-content {
      padding: 28px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy-900);
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }

    .kpi-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--navy-900);
      line-height: 1.15;
    }

    .kpi-note {
      font-size: 0.75rem;
      color: var(--text-subtle);
      margin-top: 6px;
    }

    /* Cards & Panels */
    .panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .panel-body {
      padding: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    /* Filter Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-subtle);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .input, .select, .textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: var(--bg-surface);
      font-size: 0.875rem;
      color: var(--text-primary);
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
    }

    .search-box .input {
      padding-left: 36px;
    }

    .input:focus, .select:focus, .textarea:focus {
      outline: none;
      border-color: var(--blue-700);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .filter-select {
      width: auto;
      min-width: 145px;
    }

    .segmented {
      display: inline-flex;
      background-color: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 2px;
    }

    .seg-btn {
      padding: 6px 12px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 4px;
      white-space: nowrap;
    }

    .seg-btn.active {
      background-color: var(--bg-surface);
      color: var(--navy-900);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    /* Data Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th {
      text-align: left;
      padding: 11px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      background-color: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #F8FAFC;
    }

    .num-col {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .row-title {
      font-weight: 600;
      color: var(--navy-900);
      display: block;
    }

    .row-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Semantic State Text (No pill capsules) */
    .state-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .state-pending { color: var(--warning); }
    .state-assigned { color: var(--blue-700); }
    .state-progress { color: #4338CA; }
    .state-resolved { color: var(--success); }

    .prio-low { color: var(--text-muted); font-weight: 500; }
    .prio-medium { color: var(--blue-700); font-weight: 600; }
    .prio-high { color: var(--warning); font-weight: 600; }
    .prio-urgent { color: var(--danger); font-weight: 700; }

    /* Stat Bars */
    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bar-row-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.8125rem;
      margin-bottom: 6px;
    }

    .bar-track {
      height: 8px;
      background-color: var(--bg-page);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background-color: var(--blue-700);
      border-radius: 4px;
    }

    /* Empty State */
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--navy-900);
      margin: 10px 0 6px;
    }

    .empty-desc {
      font-size: 0.875rem;
      max-width: 420px;
      margin: 0 auto 16px;
    }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--navy-900);
    }

    .field-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .field-error {
      font-size: 0.75rem;
      color: var(--danger);
      font-weight: 500;
    }

    /* Notice Banner */
    .notice {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--bg-subtle);
      font-size: 0.8125rem;
      color: var(--text-secondary);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .notice-info {
      background-color: var(--info-bg);
      border-color: #BFDBFE;
      color: #1E3A8A;
    }

    .notice-warn {
      background-color: var(--warning-bg);
      border-color: #FDE68A;
      color: #78350F;
    }

    /* Modals & Drawers */
    .backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(8, 21, 43, 0.55);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background-color: var(--bg-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-lg {
      max-width: 920px;
    }

    .modal-sm {
      max-width: 440px;
    }

    .modal-head {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .modal-body {
      padding: 22px 24px;
      overflow-y: auto;
    }

    .modal-foot {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      background-color: var(--bg-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(8, 21, 43, 0.45);
      z-index: 55;
      display: flex;
      justify-content: flex-end;
    }

    .drawer {
      width: 100%;
      max-width: 560px;
      height: 100%;
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
    }

    /* Timeline & Detail Blocks */
    .detail-kv {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 16px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin: 16px 0;
    }

    .kv-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .kv-val {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--navy-900);
    }

    .timeline {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 16px 0;
      padding: 12px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .tl-step {
      flex: 1;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-bottom: 6px;
      border-bottom: 3px solid var(--border);
    }

    .tl-step.done {
      color: var(--navy-900);
      font-weight: 600;
      border-bottom-color: var(--blue-700);
    }

    .tl-step.resolved {
      color: var(--success);
      font-weight: 700;
      border-bottom-color: var(--success);
    }

    /* Star Rating */
    .star-row {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .star-btn {
      font-size: 1.5rem;
      line-height: 1;
      color: #CBD5E1;
      transition: color 120ms var(--ease), transform 120ms var(--ease);
    }

    .star-btn.filled {
      color: #D97706;
    }

    .star-btn:hover {
      transform: scale(1.1);
    }

    /* Code Pre for SQL Schema */
    .sql-pre {
      background-color: var(--navy-950);
      color: #E2E8F0;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.6;
      padding: 18px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      white-space: pre;
    }

    /* Demo Account Selector */
    .demo-accounts {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .demo-account-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: var(--bg-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      transition: border-color 140ms var(--ease), background-color 140ms var(--ease);
    }

    .demo-account-btn:hover {
      border-color: var(--blue-700);
      background-color: var(--blue-50);
    }

    /* Toast Stack */
    .toast-stack {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 380px;
      width: calc(100% - 40px);
    }

    .toast {
      background-color: var(--navy-900);
      color: #FFFFFF;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.875rem;
      border-left: 4px solid var(--blue-600);
    }

    .toast-success { border-left-color: #22C55E; }
    .toast-error { border-left-color: #EF4444; }

    /* Loading Overlay */
    .loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background-color: var(--blue-600);
      z-index: 100;
      transform-origin: left;
      animation: loadPulse 450ms var(--ease) infinite alternate;
    }

    @keyframes loadPulse {
      from { opacity: 0.45; }
      to { opacity: 1; }
    }

    /* Responsive Rules */
    @media (max-width: 1024px) {
      .hero-grid,
      .portals-grid,
      .bento-grid,
      .steps-grid,
      .grid-2,
      .footer-grid {
        grid-template-columns: 1fr;
      }
      .bento-span-2 {
        grid-column: span 1;
      }
      .entity-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .metrics-strip-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .strip-item {
        border-right: none;
      }
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 200ms var(--ease);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .mobile-menu-btn {
        display: inline-flex;
      }
    }

    @media (max-width: 640px) {
      .landing-nav {
        display: none;
      }
      .landing-header-inner,
      .container,
      .workspace-content {
        padding-left: 16px;
        padding-right: 16px;
      }
      .form-grid,
      .detail-kv,
      .metrics-strip-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    var SQL_SCHEMA_TEXT = [
      "-- ============================================================================",
      "-- CAMPUS SERVICE REQUEST AND COMPLAINT MANAGEMENT SYSTEM (3NF RELATIONAL DDL)",
      "-- Entities: DEPARTMENT, SERVICE_CATEGORY, ADMIN, STAFF, STUDENT, TICKET, ASSIGNMENT, FEEDBACK",

      "",
      "CREATE TABLE DEPARTMENT (",

      "  created_at         TIMESTAMP DEFAULT CURRENT_TIMESTAMP",
      ");",
      "",
      "CREATE TABLE STAFF (",
      "  staff_id           INT PRIMARY KEY AUTO_INCREMENT,",
      "  dept_id            INT NOT NULL,",
      "  employee_code      VARCHAR(24)  NOT NULL UNIQUE,",
      "  full_name          VARCHAR(100) NOT NULL,",
      "  email              VARCHAR(120) NOT NULL UNIQUE,",
      "  password_hash      VARCHAR(255) NOT NULL,",
      "  designation        VARCHAR(100) NOT NULL,",
      "  phone              VARCHAR(24)  NOT NULL,",
      "  availability_status ENUM('Available','Busy','On Leave') DEFAULT 'Available',",
      "  created_at         TIMESTAMP DEFAULT CURRENT_TIMESTAMP,",
      "  CONSTRAINT fk_staff_dept FOREIGN KEY (dept_id) REFERENCES DEPARTMENT(dept_id)",
      ");",
      "",
      "CREATE TABLE STUDENT (",
      "  student_id         INT PRIMARY KEY AUTO_INCREMENT,",

      "  full_name          VARCHAR(100) NOT NULL,",

      "  phone              VARCHAR(24)  NOT NULL,",
      "  created_at         TIMESTAMP DEFAULT CURRENT_TIMESTAMP",
      ");",
      "",
      "CREATE TABLE TICKET (",
      "  ticket_id          INT PRIMARY KEY AUTO_INCREMENT,",
      "  student_id         INT NOT NULL,",
      "  category_id        INT NOT NULL,",

    function loadDB() {
      try {
        var raw = localStorage.getItem(DB_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.TICKET) && Array.isArray(parsed.DEPARTMENT)) {
            return parsed;
          }
        }
      } catch (e) { /* fall back to seed */ }
      var seed = getSeedData();
      saveDB(seed);
      return seed;
    }

    function saveDB(dbObj) {
      var target = dbObj || state.db;
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(target));
      } catch (e) {
        showToast("Storage quota warning: unable to persist changes locally.", "error");
      }
    }

    function loadSession() {
      try {
        var raw = localStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function saveSession(sess) {
      state.session = sess;
      try {
        if (sess) {
          localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch (e) { /* ignore */ }
    }

    function nextId(arr, key) {
      var max = 0;
      for (var i = 0; i < arr.length; i++) {
        if (arr[i][key] > max) max = arr[i][key];
      }
      return max + 1;
    }

    /* Relational Join / Lookup Helpers */
    function getDepartment(deptId) {
      return state.db.DEPARTMENT.find(function (d) { return d.dept_id === Number(deptId); }) || null;
    }
    function getCategory(catId) {
      return state.db.SERVICE_CATEGORY.find(function (c) { return c.category_id === Number(catId); }) || null;
    }
    function getStudent(studentId) {
      return state.db.STUDENT.find(function (s) { return s.student_id === Number(studentId); }) || null;
    }
    function getStaff(staffId) {
      return state.db.STAFF.find(function (s) { return s.staff_id === Number(staffId); }) || null;
    }
    function getAdmin(adminId) {
      return state.db.ADMIN.find(function (a) { return a.admin_id === Number(adminId); }) || null;
    }
    function getTicket(ticketId) {
      return state.db.TICKET.find(function (t) { return t.ticket_id === Number(ticketId); }) || null;
    }
    function getTicketAssignments(ticketId) {
      return state.db.ASSIGNMENT.filter(function (a) { return a.ticket_id === Number(ticketId); })
        .sort(function (a, b) { return b.assignment_id - a.assignment_id; });
    }
    function getActiveAssignment(ticketId) {
      var list = getTicketAssignments(ticketId);
      return list.find(function (a) { return a.assignment_status !== "Reassigned"; }) || list[0] || null;
    }
    function getTicketFeedback(ticketId) {
      return state.db.FEEDBACK.find(function (f) { return f.ticket_id === Number(ticketId); }) || null;
    }

    /* Formatting & Sanitization */
    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmtDate(iso) {
      if (!iso) return "—";
      var d = new Date(iso);
      if (isNaN(d.getTime())) return esc(iso);
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function fmtDateTime(iso) {
      if (!iso) return "—";
      var d = new Date(iso);
      if (isNaN(d.getTime())) return esc(iso);
      return d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function statusHtml(status) {
      var cls = "state-pending";
      var sym = "○";
      if (status === "Assigned") { cls = "state-assigned"; sym = "◐"; }
      else if (status === "In Progress") { cls = "state-progress"; sym = "◔"; }
      else if (status === "Resolved") { cls = "state-resolved"; sym = "●"; }
      return '<span class="state-label ' + cls + '"><span aria-hidden="true">' + sym + '</span>' + esc(status) + '</span>';
    }

    function priorityHtml(priority) {
      var cls = "prio-medium";
      if (priority === "Low") cls = "prio-low";
      else if (priority === "High") cls = "prio-high";
      else if (priority === "Urgent") cls = "prio-urgent";
      return '<span class="' + cls + '">' + esc(priority) + '</span>';
    }

    function recordOriginText(ticket) {
      return ticket.is_sample ? "Sample Record" : "Submitted Record";
    }

    function showLoading(ms) {
      var el = document.getElementById("loading-root");
      el.innerHTML = '<div class="loading-bar" role="status" aria-label="Processing"></div>';
      setTimeout(function () { el.innerHTML = ""; }, ms || 220);
    }

    function showToast(msg, type) {
      var root = document.getElementById("toast-root");
      var div = document.createElement("div");
      var cls = type === "error" ? "toast toast-error" : (type === "success" ? "toast toast-success" : "toast");
      div.className = cls;
      div.innerHTML = '<span>' + esc(msg) + '</span><button type="button" aria-label="Dismiss notification" style="color:#CBD5E1;font-weight:700;">&times;</button>';
      div.querySelector("button").addEventListener("click", function () {
        if (div.parentNode) div.parentNode.removeChild(div);
      });
      root.appendChild(div);
      setTimeout(function () {
        if (div.parentNode) div.parentNode.removeChild(div);
      }, 4200);
    }
