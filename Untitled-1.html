    /* Authentication Modal (Academic Demo Login + Demo Student Registration) */
    function openAuthModal(initialRole) {
      var activeRole = initialRole || "student";
      var registerMode = false;

      function renderAuth() {
        var demoRows = [];
        if (activeRole === "student") {
          demoRows = state.db.STUDENT.map(function (s) {
            return { id: s.student_id, label: s.full_name, sub: s.roll_number + " · " + s.program, email: s.email, pass: s.password_demo };
          });
        } else if (activeRole === "admin") {
          demoRows = state.db.ADMIN.map(function (a) {
            return { id: a.admin_id, label: a.full_name, sub: a.role_title, email: a.email, pass: a.password_demo };
          });
        } else {
          demoRows = state.db.STAFF.map(function (st) {
            var d = getDepartment(st.dept_id);
            return { id: st.staff_id, label: st.full_name, sub: st.employee_code + " · " + (d ? d.dept_code : ""), email: st.email, pass: st.password_demo };
          });
        }

        var roleTitle = activeRole === "student" ? "Student Portal" : (activeRole === "admin" ? "Admin Console" : "Staff Workbench");

        var formHtml = "";
        if (activeRole === "student" && registerMode) {
          formHtml =
            '<form id="reg-student-form" novalidate>' +
              '<div class="form-grid">' +
                '<div class="form-group"><label class="label" for="reg-name">Full Name</label><input class="input" id="reg-name" required placeholder="e.g., Priya Verma" /></div>' +
                '<div class="form-group"><label class="label" for="reg-roll">Roll Number</label><input class="input" id="reg-roll" required placeholder="e.g., CS2025041" /></div>' +
                '<div class="form-group"><label class="label" for="reg-email">University Email</label><input class="input" type="email" id="reg-email" required placeholder="priya@crestview.edu" /></div>' +
                '<div class="form-group"><label class="label" for="reg-phone">Phone</label><input class="input" id="reg-phone" required placeholder="+1-555-0399" /></div>' +
                '<div class="form-group"><label class="label" for="reg-prog">Program</label><input class="input" id="reg-prog" required value="B.Tech Computer Science" /></div>' +
                '<div class="form-group"><label class="label" for="reg-block">Hostel / Academic Block</label><input class="input" id="reg-block" required placeholder="Cedar Hall - 104" /></div>' +
                '<div class="form-group form-full"><label class="label" for="reg-pass">Demo Password</label><input class="input" type="password" id="reg-pass" required value="student123" /></div>' +
              '</div>' +
              '<div id="auth-error" class="field-error" style="margin-top:10px;"></div>' +
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;">' +
                '<button type="button" class="btn btn-ghost btn-sm" id="toggle-reg-btn">Back to Student Sign In</button>' +
                '<button type="submit" class="btn btn-blue">Create Demo Student &amp; Enter</button>' +
              '</div>' +
            '</form>';
        } else {
          formHtml =
            '<form id="login-form" novalidate>' +
              '<div class="form-grid">' +
                '<div class="form-group form-full">' +
                  '<label class="label" for="login-ident">' + (activeRole === "student" ? "University Email or Roll Number" : "University Email") + '</label>' +
                  '<input class="input" id="login-ident" required value="' + esc(demoRows[0] ? demoRows[0].email : "") + '" />' +
                '</div>' +
                '<div class="form-group form-full">' +
                  '<label class="label" for="login-pass">Demo Password</label>' +
                  '<input class="input" type="password" id="login-pass" required value="' + esc(demoRows[0] ? demoRows[0].pass : "") + '" />' +
                '</div>' +
              '</div>' +
              '<div id="auth-error" class="field-error" style="margin-top:10px;"></div>' +
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;">' +
                (activeRole === "student"
                  ? '<button type="button" class="btn btn-ghost btn-sm" id="toggle-reg-btn">Register New Demo Student</button>'
                  : '<span></span>') +
                '<button type="submit" class="btn btn-primary">Sign In to ' + roleTitle + '</button>' +
              '</div>' +
            '</form>' +
            '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">' +
              '<div class="label" style="margin-bottom:4px;">One-Click Academic Demo Accounts</div>' +
              '<div class="field-hint">Select any seeded ' + activeRole + ' record to enter immediately:</div>' +
              '<div class="demo-accounts">' +
                demoRows.map(function (r) {
                  return (
                    '<button type="button" class="demo-account-btn" data-quick-id="' + r.id + '">' +
                      '<div><div style="font-weight:600;font-size:0.875rem;color:var(--navy-900);">' + esc(r.label) + '</div>' +
                      '<div style="font-size:0.75rem;color:var(--text-muted);">' + esc(r.sub) + ' · ' + esc(r.email) + '</div></div>' +
                      '<span style="font-size:0.75rem;font-weight:600;color:var(--blue-700);">Enter &rarr;</span>' +
                    '</button>'
                  );
                }).join("") +
              '</div>' +
            '</div>';
        }

        document.getElementById("modal-root").innerHTML =
          '<div class="backdrop" id="auth-backdrop">' +
            '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">' +
              '<div class="modal-head">' +
                '<h3 class="modal-title" id="auth-modal-title">Campus Portal Role Access</h3>' +
                '<button type="button" class="btn-ghost" id="auth-close-btn" aria-label="Close">' + icon("x", 18) + '</button>' +
              '</div>' +
              '<div class="modal-body">' +
                '<div class="segmented" style="margin-bottom:16px;">' +
                  '<button type="button" class="seg-btn ' + (activeRole === "student" ? "active" : "") + '" data-switch-role="student">Student</button>' +
                  '<button type="button" class="seg-btn ' + (activeRole === "admin" ? "active" : "") + '" data-switch-role="admin">Admin</button>' +
                  '<button type="button" class="seg-btn ' + (activeRole === "staff" ? "active" : "") + '" data-switch-role="staff">Staff</button>' +
                '</div>' +
                '<div class="notice notice-warn" style="margin-bottom:16px;">' +
                  icon("alert", 16) +
                  '<span><strong>Academic Demonstration Notice:</strong> Client-side role login is for local DBMS demonstration only and does not provide production authentication security.</span>' +
                '</div>' +
                formHtml +
              '</div>' +
            '</div>' +
          '</div>';

        document.getElementById("auth-close-btn").onclick = closeModal;
        document.getElementById("auth-backdrop").onclick = function (e) { if (e.target.id === "auth-backdrop") closeModal(); };

        var sw = document.querySelectorAll("[data-switch-role]");
        for (var i = 0; i < sw.length; i++) {
          (function (btn) {
            btn.onclick = function () {
              activeRole = btn.getAttribute("data-switch-role");
              registerMode = false;
              renderAuth();
            };
          })(sw[i]);
        }

        var toggleReg = document.getElementById("toggle-reg-btn");
        if (toggleReg) {
          toggleReg.onclick = function () {
            registerMode = !registerMode;
            renderAuth();
          };
        }

        var loginForm = document.getElementById("login-form");
        if (loginForm) {
          loginForm.onsubmit = function (e) {
            e.preventDefault();
            var ident = document.getElementById("login-ident").value.trim().toLowerCase();
            var pass = document.getElementById("login-pass").value;
            var errEl = document.getElementById("auth-error");
            if (!ident || !pass) {
              errEl.textContent = "Please enter both email/ID and password.";
              return;
            }
            var found = null;
            if (activeRole === "student") {
              found = state.db.STUDENT.find(function (s) {
                return (s.email.toLowerCase() === ident || s.roll_number.toLowerCase() === ident) && s.password_demo === pass;
              });
              if (found) completeLogin("student", found.student_id, found.full_name);
            } else if (activeRole === "admin") {
              found = state.db.ADMIN.find(function (a) {
                return a.email.toLowerCase() === ident && a.password_demo === pass;
              });
              if (found) completeLogin("admin", found.admin_id, found.full_name);
            } else {
              found = state.db.STAFF.find(function (st) {
                return (st.email.toLowerCase() === ident || st.employee_code.toLowerCase() === ident) && st.password_demo === pass;
              });
              if (found) completeLogin("staff", found.staff_id, found.full_name);
            }
            if (!found) {
              errEl.textContent = "Invalid demo credentials for " + activeRole + ". Try one of the quick-access accounts below.";
            }
          };
        }

        var regForm = document.getElementById("reg-student-form");
        if (regForm) {
          regForm.onsubmit = function (e) {
            e.preventDefault();
            var name = document.getElementById("reg-name").value.trim();
            var roll = document.getElementById("reg-roll").value.trim().toUpperCase();
            var email = document.getElementById("reg-email").value.trim().toLowerCase();
            var phone = document.getElementById("reg-phone").value.trim();
            var prog = document.getElementById("reg-prog").value.trim();
            var block = document.getElementById("reg-block").value.trim();
            var pass = document.getElementById("reg-pass").value;
            var errEl = document.getElementById("auth-error");
            if (!name || !roll || !email || !phone || !prog || !block || pass.length < 4) {
              errEl.textContent = "All fields are required (password minimum 4 characters).";
              return;
            }
            var dup = state.db.STUDENT.some(function (s) {
              return s.email.toLowerCase() === email || s.roll_number.toUpperCase() === roll;
            });
            if (dup) {
              errEl.textContent = "A student with that email or roll number already exists.";
              return;
            }
            var newId = nextId(state.db.STUDENT, "student_id");
            state.db.STUDENT.push({
              student_id: newId,
              roll_number: roll,
              full_name: name,
              email: email,
              password_demo: pass,
              program: prog,
              semester: 1,
              hostel_or_block: block,
              phone: phone,
              created_at: new Date().toISOString().slice(0, 10)
            });
            saveDB();
            showToast("Demo student account created and persisted to localStorage.", "success");
            completeLogin("student", newId, name);
          };
        }

        var quickBtns = document.querySelectorAll("[data-quick-id]");
        for (var j = 0; j < quickBtns.length; j++) {
          (function (btn) {
            btn.onclick = function () {
              var id = Number(btn.getAttribute("data-quick-id"));
              var name = "";
              if (activeRole === "student") name = getStudent(id).full_name;
              else if (activeRole === "admin") name = getAdmin(id).full_name;
              else name = getStaff(id).full_name;
              completeLogin(activeRole, id, name);
            };
          })(quickBtns[j]);
        }
      }

      renderAuth();
    }

    function completeLogin(role, userId, name) {
      closeModal();
      showLoading(220);
      saveSession({ role: role, userId: userId });
      state.activeTab = "dashboard";
      state.searchQuery = "";
      state.statusFilter = "All";
      state.priorityFilter = "All";
      state.categoryFilter = "All";
      state.recordTypeFilter = "All";
      showToast("Signed in as " + name + " (" + role.toUpperCase() + " demo).", "success");
      renderApp();
    }

    function logout() {
      openConfirmModal(
        "Sign Out of Portal",
        "Return to the public university portal landing page? All submitted records remain saved in localStorage.",
        "Sign Out",
        "btn-primary",
        function () {
          closeDrawer();
          saveSession(null);
          renderApp();
          showToast("Signed out cleanly.", "info");
        }
      );
    }

    /* Student Dashboard */
    function renderStudentDashboard(student) {
      var myTickets = state.db.TICKET.filter(function (t) { return t.student_id === student.student_id; })
        .sort(function (a, b) { return b.ticket_id - a.ticket_id; });

      var total = myTickets.length;
      var pending = myTickets.filter(function (t) { return t.status === "Pending"; }).length;
      var inProgress = myTickets.filter(function (t) { return t.status === "Assigned" || t.status === "In Progress"; }).length;
      var resolved = myTickets.filter(function (t) { return t.status === "Resolved"; }).length;

      var q = state.searchQuery.toLowerCase();
      var filtered = myTickets.filter(function (t) {
        if (state.statusFilter !== "All" && t.status !== state.statusFilter) return false;
        if (state.categoryFilter !== "All" && String(t.category_id) !== state.categoryFilter) return false;
        if (q) {
          var hay = ("TKT-" + t.ticket_id + " " + t.title + " " + t.campus_location).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      var rowsHtml = "";
      if (filtered.length === 0) {
        rowsHtml =
          '<div class="empty-state">' +
            icon("ticket", 32) +
            '<div class="empty-title">No matching complaints found</div>' +
            '<p class="empty-desc">Adjust your search or filters, or raise a new campus service request.</p>' +
            '<button type="button" class="btn btn-blue btn-sm" id="empty-raise-btn">Raise New Complaint</button>' +
          '</div>';
      } else {
        rowsHtml =
          '<div class="table-wrap"><table>' +
            '<thead><tr>' +
              '<th>Ticket</th>' +
              '<th>Category &amp; Dept</th>' +
              '<th>Campus Location</th>' +
              '<th>Priority</th>' +
              '<th>Status</th>' +
              '<th>Assigned Staff</th>' +
              '<th class="num-col">Actions</th>' +
            '</tr></thead>' +
            '<tbody>' +
            filtered.map(function (t) {
              var cat = getCategory(t.category_id);
              var dept = cat ? getDepartment(cat.dept_id) : null;
              var assign = getActiveAssignment(t.ticket_id);
              var staff = assign ? getStaff(assign.staff_id) : null;
              var fb = getTicketFeedback(t.ticket_id);
              var actionBtnLabel = (t.status === "Resolved" && !fb) ? "Track &amp; Rate" : "View Details";
              return (
                '<tr>' +
                  '<td>' +
                    '<span class="row-title"><span class="mono">TKT-' + t.ticket_id + '</span> &middot; ' + esc(t.title) + '</span>' +
                    '<span class="row-meta">' + fmtDate(t.created_at) + ' &middot; ' + recordOriginText(t) + '</span>' +
                  '</td>' +
                  '<td>' +
                    '<span>' + esc(cat ? cat.category_name : "—") + '</span>' +
                    '<span class="row-meta" style="display:block;">' + esc(dept ? dept.dept_name : "") + '</span>' +
                  '</td>' +
                  '<td>' + esc(t.campus_location) + '</td>' +
                  '<td>' + priorityHtml(t.priority) + '</td>' +
                  '<td>' + statusHtml(t.status) + '</td>' +
                  '<td>' +
                    (staff
                      ? '<span>' + esc(staff.full_name) + '</span><span class="row-meta" style="display:block;">' + esc(staff.designation) + '</span>'
                      : '<span style="color:var(--text-muted);">Awaiting assignment</span>') +
                  '</td>' +
                  '<td class="num-col">' +
                    '<button type="button" class="btn btn-secondary btn-sm" data-inspect-ticket="' + t.ticket_id + '">' + actionBtnLabel + '</button>' +
                  '</td>' +
                '</tr>'
              );
            }).join("") +
            '</tbody>' +
          '</table></div>';
      }

      var catOptions = state.db.SERVICE_CATEGORY.map(function (c) {
        return '<option value="' + c.category_id + '"' + (state.categoryFilter === String(c.category_id) ? ' selected' : '') + '>' + esc(c.category_name) + '</option>';
      }).join("");

      return (
        '<div class="page-head">' +
          '<div>' +
            '<h1 class="page-title">Welcome back, ' + esc(student.full_name) + '</h1>' +
            '<p class="page-subtitle">' + esc(student.roll_number) + ' &middot; ' + esc(student.program) + ' &middot; ' + esc(student.hostel_or_block) + '</p>' +
          '</div>' +
          '<button type="button" class="btn btn-blue" id="raise-complaint-btn">' + icon("plus", 16) + '<span>Raise New Complaint</span></button>' +
        '</div>' +

        '<div class="kpi-grid">' +
          '<div class="kpi-card"><div class="kpi-label">Total Complaints</div><div class="kpi-value tabular">' + total + '</div><div class="kpi-note">All submitted by you</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Pending Complaints</div><div class="kpi-value tabular" style="color:var(--warning);">' + pending + '</div><div class="kpi-note">Awaiting admin triage</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">In Progress / Assigned</div><div class="kpi-value tabular" style="color:var(--blue-700);">' + inProgress + '</div><div class="kpi-note">Assigned to campus staff</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Resolved Complaints</div><div class="kpi-value tabular" style="color:var(--success);">' + resolved + '</div><div class="kpi-note">Ready for feedback</div></div>' +
        '</div>' +

        '<section class="panel">' +
          '<div class="panel-header">' +
            '<h2 class="panel-title">My Submitted Complaints &amp; Service Requests</h2>' +
            '<span style="font-size:0.8125rem;color:var(--text-muted);" class="tabular">' + filtered.length + ' of ' + total + ' records</span>' +
          '</div>' +
          '<div class="toolbar">' +
            '<div class="search-box">' + icon("search", 16) + '<input type="search" class="input" id="student-search" placeholder="Search ticket ID, title, or campus location..." value="' + esc(state.searchQuery) + '" /></div>' +
            '<select class="select filter-select" id="student-status-filter" aria-label="Filter by status">' +
              '<option value="All"' + (state.statusFilter === "All" ? " selected" : "") + '>All Statuses</option>' +
              '<option value="Pending"' + (state.statusFilter === "Pending" ? " selected" : "") + '>Pending</option>' +
              '<option value="Assigned"' + (state.statusFilter === "Assigned" ? " selected" : "") + '>Assigned</option>' +
              '<option value="In Progress"' + (state.statusFilter === "In Progress" ? " selected" : "") + '>In Progress</option>' +
              '<option value="Resolved"' + (state.statusFilter === "Resolved" ? " selected" : "") + '>Resolved</option>' +
            '</select>' +
            '<select class="select filter-select" id="student-cat-filter" aria-label="Filter by category">' +
              '<option value="All">All Categories</option>' + catOptions +
            '</select>' +
          '</div>' +
          rowsHtml +
        '</section>'
      );
    }

    function bindStudentEvents() {
      var raiseBtn = document.getElementById("raise-complaint-btn");
      if (raiseBtn) raiseBtn.onclick = openNewComplaintModal;
      var emptyRaise = document.getElementById("empty-raise-btn");
      if (emptyRaise) emptyRaise.onclick = openNewComplaintModal;

      var sInput = document.getElementById("student-search");
      if (sInput) {
        sInput.oninput = function () {
          state.searchQuery = sInput.value;
          renderWorkspaceBody();
          var again = document.getElementById("student-search");
          if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        };
      }
      var stSel = document.getElementById("student-status-filter");
      if (stSel) stSel.onchange = function () { state.statusFilter = stSel.value; renderWorkspaceBody(); };
      var catSel = document.getElementById("student-cat-filter");
      if (catSel) catSel.onchange = function () { state.categoryFilter = catSel.value; renderWorkspaceBody(); };

      bindTicketInspectButtons();
    }

    function openNewComplaintModal() {
      var activeCats = state.db.SERVICE_CATEGORY.filter(function (c) { return c.is_active; });
      var options = activeCats.map(function (c) {
        var dept = getDepartment(c.dept_id);
        return '<option value="' + c.category_id + '">' + esc(c.category_name) + ' (' + esc(dept ? dept.dept_code : "") + ' · SLA ' + c.sla_hours + 'h)</option>';
      }).join("");

      document.getElementById("modal-root").innerHTML =
        '<div class="backdrop" id="complaint-backdrop">' +
          '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="new-comp-title">' +
            '<div class="modal-head">' +
              '<h3 class="modal-title" id="new-comp-title">Raise New Campus Complaint</h3>' +
              '<button type="button" class="btn-ghost" id="comp-close-btn" aria-label="Close">' + icon("x", 18) + '</button>' +
            '</div>' +
            '<form id="new-complaint-form" novalidate>' +
              '<div class="modal-body">' +
                '<div class="form-grid">' +
                  '<div class="form-group form-full">' +
                    '<label class="label" for="comp-category">Service Category</label>' +
                    '<select class="select" id="comp-category" required>' + options + '</select>' +
                  '</div>' +
                  '<div class="form-group form-full">' +
                    '<label class="label" for="comp-title">Complaint Title</label>' +
                    '<input class="input" id="comp-title" required maxlength="140" placeholder="Short, clear summary (e.g., Broken lab projector in Room 204)" />' +
                  '</div>' +
                  '<div class="form-group">' +
                    '<label class="label" for="comp-location">Campus Location</label>' +
                    '<input class="input" id="comp-location" required maxlength="140" placeholder="Building, floor, room or hostel" />' +
                  '</div>' +
                  '<div class="form-group">' +
                    '<label class="label" for="comp-priority">Priority Level</label>' +
                    '<select class="select" id="comp-priority" required>' +
                      '<option value="Low">Low</option>' +
                      '<option value="Medium" selected>Medium</option>' +
                      '<option value="High">High</option>' +
                      '<option value="Urgent">Urgent</option>' +
                    '</select>' +
                  '</div>' +
                  '<div class="form-group form-full">' +
                    '<label class="label" for="comp-desc">Detailed Description</label>' +
                    '<textarea class="textarea" id="comp-desc" rows="4" required placeholder="Describe the issue, observed symptoms, and best time for technician access..."></textarea>' +
                  '</div>' +
                '</div>' +
                '<div id="comp-form-err" class="field-error" style="margin-top:10px;"></div>' +
              '</div>' +
              '<div class="modal-foot">' +
                '<button type="button" class="btn btn-secondary" id="comp-cancel-btn">Cancel</button>' +
                '<button type="submit" class="btn btn-blue">Submit Complaint</button>' +
              '</div>' +
            '</form>' +
          '</div>' +
        '</div>';

      document.getElementById("comp-close-btn").onclick = closeModal;
      document.getElementById("comp-cancel-btn").onclick = closeModal;
      document.getElementById("complaint-backdrop").onclick = function (e) { if (e.target.id === "complaint-backdrop") closeModal(); };

      document.getElementById("new-complaint-form").onsubmit = function (e) {
        e.preventDefault();
        var catId = Number(document.getElementById("comp-category").value);
        var title = document.getElementById("comp-title").value.trim();
        var location = document.getElementById("comp-location").value.trim();
        var priority = document.getElementById("comp-priority").value;
        var desc = document.getElementById("comp-desc").value.trim();
        var err = document.getElementById("comp-form-err");

        if (title.length < 5) { err.textContent = "Please provide a complaint title of at least 5 characters."; return; }
        if (location.length < 3) { err.textContent = "Please specify the campus location (building/room)."; return; }
        if (desc.length < 10) { err.textContent = "Please provide a detailed description (at least 10 characters)."; return; }

        var now = new Date().toISOString();
        var newId = nextId(state.db.TICKET, "ticket_id");
        state.db.TICKET.push({
          ticket_id: newId,
          student_id: state.session.userId,
          category_id: catId,
          title: title,
          description: desc,
          campus_location: location,
          priority: priority,
          status: "Pending",
          is_sample: false,
          created_at: now,
          updated_at: now,
          resolved_at: null
        });
        saveDB();
        closeModal();
        showLoading(180);
        showToast("Ticket TKT-" + newId + " submitted and saved as a new user record.", "success");
        renderWorkspaceBody();
      };
    }

    /* Workspace Shell & Navigation */
    function renderApp() {
      var sess = state.session;
      if (!sess) {
        renderLanding();
        return;
      }

      var user = null;
      var roleLabel = "";
      var userMeta = "";
      var navItems = [];

      if (sess.role === "student") {
        user = getStudent(sess.userId);
        if (!user) { saveSession(null); renderLanding(); return; }
        roleLabel = "Student Portal";
        userMeta = user.roll_number + " · " + user.program;
        navItems = [
          { id: "dashboard", label: "My Complaints", icon: "ticket", count: state.db.TICKET.filter(function (t) { return t.student_id === user.student_id; }).length },
          { id: "raise_new", label: "Raise Complaint", icon: "plus", count: "" }
        ];
      } else if (sess.role === "admin") {
        user = getAdmin(sess.userId);
        if (!user) { saveSession(null); renderLanding(); return; }
        roleLabel = "Admin Console";
        userMeta = user.role_title;
        navItems = [
          { id: "dashboard", label: "Dashboard", icon: "home", count: "" },
          { id: "tickets", label: "Manage Tickets", icon: "ticket", count: state.db.TICKET.length },
          { id: "assign", label: "Assign Staff", icon: "userCheck", count: state.db.TICKET.filter(function (t) { return t.status === "Pending"; }).length },
          { id: "students", label: "Students", icon: "graduation", count: state.db.STUDENT.length },
          { id: "staff", label: "Staff", icon: "users", count: state.db.STAFF.length },
          { id: "departments", label: "Departments", icon: "building", count: state.db.DEPARTMENT.length },
          { id: "categories", label: "Categories", icon: "layers", count: state.db.SERVICE_CATEGORY.length },
          { id: "feedback", label: "Feedback", icon: "star", count: state.db.FEEDBACK.length }
        ];
      } else if (sess.role === "staff") {
        user = getStaff(sess.userId);
        if (!user) { saveSession(null); renderLanding(); return; }
        var dept = getDepartment(user.dept_id);
        roleLabel = "Staff Workbench";
        userMeta = user.employee_code + " · " + (dept ? dept.dept_code : "");
        var myAssignedCount = state.db.ASSIGNMENT.filter(function (a) { return a.staff_id === user.staff_id && a.assignment_status !== "Reassigned"; }).length;
        navItems = [
          { id: "dashboard", label: "Assigned Complaints", icon: "wrench", count: myAssignedCount },
          { id: "history", label: "Assignment History", icon: "clock", count: state.db.ASSIGNMENT.filter(function (a) { return a.staff_id === user.staff_id; }).length }
        ];
      }

      var currentNav = navItems.find(function (n) { return n.id === state.activeTab; }) || navItems[0];

      var html =
        '<div class="app-shell">' +
          '<aside class="sidebar ' + (state.sidebarOpen ? "open" : "") + '" id="app-sidebar" aria-label="Workspace Navigation">' +
            '<div class="sidebar-brand">' +
              '<div class="sidebar-brand-name">Crestview Service Desk</div>' +
              '<div class="sidebar-role">' + esc(roleLabel) + '</div>' +
            '</div>' +
            '<nav class="sidebar-nav">' +
              navItems.map(function (item) {
                var activeCls = state.activeTab === item.id ? " active" : "";
                return (
                  '<button type="button" class="nav-item' + activeCls + '" data-nav-id="' + item.id + '">' +
                    '<span class="nav-item-left">' + icon(item.icon, 16) + '<span>' + esc(item.label) + '</span></span>' +
                    (item.count !== "" ? '<span class="nav-count">' + item.count + '</span>' : '') +
                  '</button>'
                );
              }).join("") +
            '</nav>' +
            '<div class="sidebar-footer">' +
              '<button type="button" class="nav-item" id="sb-switch-role"><span class="nav-item-left">' + icon("users", 16) + '<span>Switch Demo Role</span></span></button>' +
              '<button type="button" class="nav-item" id="sb-sql-docs"><span class="nav-item-left">' + icon("database", 16) + '<span>SQL Schema &amp; Docs</span></span></button>' +
              '<button type="button" class="nav-item" id="sb-reset-db"><span class="nav-item-left">' + icon("refresh", 16) + '<span>Reset Demo Data</span></span></button>' +
              '<button type="button" class="nav-item" id="sb-logout"><span class="nav-item-left">' + icon("logOut", 16) + '<span>Sign Out</span></span></button>' +
            '</div>' +
          '</aside>' +
          '<div class="main-area">' +
            '<header class="topbar">' +
              '<div class="topbar-left">' +
                '<button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Navigation">' + icon("menu", 18) + '</button>' +
                '<div class="breadcrumb">' + esc(roleLabel) + ' / <strong>' + esc(currentNav ? currentNav.label : "Dashboard") + '</strong></div>' +
              '</div>' +
              '<div class="topbar-right">' +
                '<div class="user-summary">' +
                  '<div class="user-summary-name">' + esc(user.full_name) + '</div>' +
                  '<div class="user-summary-meta">' + esc(userMeta) + '</div>' +
                '</div>' +
                '<button type="button" class="btn btn-secondary btn-sm" id="topbar-switch-btn">Switch Role</button>' +
                '<button type="button" class="btn btn-ghost btn-sm" id="topbar-logout-btn">Sign Out</button>' +
              '</div>' +
            '</header>' +
            '<main class="workspace-content" id="workspace-body"></main>' +
          '</div>' +
        '</div>';

      document.getElementById("app").innerHTML = html;

      document.getElementById("mobile-menu-btn").onclick = function () {
        state.sidebarOpen = !state.sidebarOpen;
        var sb = document.getElementById("app-sidebar");
        if (sb) sb.classList.toggle("open", state.sidebarOpen);
      };
      document.getElementById("sb-switch-role").onclick = function () { openAuthModal(sess.role); };
      document.getElementById("topbar-switch-btn").onclick = function () { openAuthModal(sess.role); };
      document.getElementById("sb-sql-docs").onclick = openSqlSchemaModal;
      document.getElementById("sb-reset-db").onclick = promptResetDB;
      document.getElementById("sb-logout").onclick = logout;
      document.getElementById("topbar-logout-btn").onclick = logout;

      var navBtns = document.querySelectorAll("[data-nav-id]");
      for (var i = 0; i < navBtns.length; i++) {
        (function (btn) {
          btn.onclick = function () {
            var id = btn.getAttribute("data-nav-id");
            state.sidebarOpen = false;
            if (id === "raise_new" && sess.role === "student") {
              openNewComplaintModal();
              return;
            }
            state.activeTab = id;
            renderApp();
          };
        })(navBtns[i]);
      }

      renderWorkspaceBody();
    }

    function renderWorkspaceBody() {
      var body = document.getElementById("workspace-body");
      if (!body || !state.session) return;
      var role = state.session.role;
      if (role === "student") {
        body.innerHTML = renderStudentDashboard(getStudent(state.session.userId));
        bindStudentEvents();
      } else if (role === "admin") {
        body.innerHTML = renderAdminTab();
        bindAdminEvents();
      } else if (role === "staff") {
        body.innerHTML = renderStaffTab(getStaff(state.session.userId));
        bindStaffEvents();
      }
    }

    /* Admin Dashboard Views */
    function renderAdminTab() {
      var tab = state.activeTab;
      if (tab === "dashboard") return renderAdminOverview();
      if (tab === "tickets") return renderAdminTickets();
      if (tab === "assign") return renderAdminAssign();
      if (tab === "students") return renderAdminStudents();
      if (tab === "staff") return renderAdminStaff();
      if (tab === "departments") return renderAdminDepartments();
      if (tab === "categories") return renderAdminCategories();
      if (tab === "feedback") return renderAdminFeedback();
      return renderAdminOverview();
    }

    function renderAdminOverview() {
      var tickets = state.db.TICKET;
      var total = tickets.length;
      var pending = tickets.filter(function (t) { return t.status === "Pending"; }).length;
      var assigned = tickets.filter(function (t) { return t.status === "Assigned"; }).length;
      var inProgress = tickets.filter(function (t) { return t.status === "In Progress"; }).length;
      var resolved = tickets.filter(function (t) { return t.status === "Resolved"; }).length;

      var recent = tickets.slice().sort(function (a, b) { return b.ticket_id - a.ticket_id; }).slice(0, 6);

      var catStats = state.db.SERVICE_CATEGORY.map(function (c) {
        var count = tickets.filter(function (t) { return t.category_id === c.category_id; }).length;
        return { name: c.category_name, count: count };
      }).sort(function (a, b) { return b.count - a.count; });

      var prioOrder = [
        { name: "Urgent", color: "var(--danger)" },
        { name: "High", color: "var(--warning)" },
        { name: "Medium", color: "var(--blue-700)" },
        { name: "Low", color: "#64748B" }
      ];

      return (
        '<div class="page-head">' +
          '<div>' +
            '<h1 class="page-title">Campus Operations Overview</h1>' +
            '<p class="page-subtitle">Real-time service desk metrics across all 8 relational entities.</p>' +
          '</div>' +
          '<button type="button" class="btn btn-blue" id="admin-goto-assign">' + icon("userCheck", 16) + '<span>Review Assignment Queue (' + pending + ')</span></button>' +
        '</div>' +

        '<div class="kpi-grid">' +
          '<div class="kpi-card"><div class="kpi-label">Total Tickets</div><div class="kpi-value tabular">' + total + '</div><div class="kpi-note">Sample &amp; user submitted</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Pending Tickets</div><div class="kpi-value tabular" style="color:var(--warning);">' + pending + '</div><div class="kpi-note">Needs staff assignment</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Assigned Tickets</div><div class="kpi-value tabular" style="color:var(--blue-700);">' + assigned + '</div><div class="kpi-note">Dispatched to staff</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">In Progress</div><div class="kpi-value tabular" style="color:#4338CA;">' + inProgress + '</div><div class="kpi-note">Active field work</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Resolved Tickets</div><div class="kpi-value tabular" style="color:var(--success);">' + resolved + '</div><div class="kpi-note">Completed resolutions</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Total Students</div><div class="kpi-value tabular">' + state.db.STUDENT.length + '</div><div class="kpi-note">Registered profiles</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Total Staff</div><div class="kpi-value tabular">' + state.db.STAFF.length + '</div><div class="kpi-note">Across ' + state.db.DEPARTMENT.length + ' departments</div></div>' +
        '</div>' +

        '<div class="grid-2">' +
          '<section class="panel" style="margin-bottom:0;">' +
            '<div class="panel-header"><h2 class="panel-title">Category-Wise Statistics</h2></div>' +
            '<div class="panel-body"><div class="bar-list">' +
              catStats.map(function (cs) {
                var pct = total ? Math.round((cs.count / total) * 100) : 0;
                return (
                  '<div>' +
                    '<div class="bar-row-head"><span>' + esc(cs.name) + '</span><span class="tabular" style="font-weight:600;">' + cs.count + ' (' + pct + '%)</span></div>' +
                    '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div>' +
                  '</div>'
                );
              }).join("") +
            '</div></div>' +
          '</section>' +

          '<section class="panel" style="margin-bottom:0;">' +
            '<div class="panel-header"><h2 class="panel-title">Priority-Wise Statistics</h2></div>' +
            '<div class="panel-body"><div class="bar-list">' +
              prioOrder.map(function (po) {
                var cnt = tickets.filter(function (t) { return t.priority === po.name; }).length;

                  '</div>'
                );

            '</div></div>' +
          '</section>' +
        '</div>' +

        '<section class="panel">' +
          '<div class="panel-header">' +

    function renderAdminTickets() {
      var q = state.searchQuery.toLowerCase();
      var list = state.db.TICKET.filter(function (t) {
        if (state.statusFilter !== "All" && t.status !== state.statusFilter) return false;
        if (state.priorityFilter !== "All" && t.priority !== state.priorityFilter) return false;
        if (state.categoryFilter !== "All" && String(t.category_id) !== state.categoryFilter) return false;
        if (state.recordTypeFilter === "sample" && !t.is_sample) return false;
        if (state.recordTypeFilter === "user" && t.is_sample) return false;
        if (q) {
          var stud = getStudent(t.student_id);
          var hay = ("TKT-" + t.ticket_id + " " + t.title + " " + t.campus_location + " " + (stud ? stud.full_name + " " + stud.roll_number : "")).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      }).sort(function (a, b) { return b.ticket_id - a.ticket_id; });

      var catOptions = state.db.SERVICE_CATEGORY.map(function (c) {
        return '<option value="' + c.category_id + '"' + (state.categoryFilter === String(c.category_id) ? ' selected' : '') + '>' + esc(c.category_name) + '</option>';
      }).join("");

      return (
        '<div class="page-head">' +
          '<div><h1 class="page-title">Manage Tickets</h1><p class="page-subtitle">Search, filter, assign staff, and update statuses across all campus complaints.</p></div>' +
          '<span class="tabular" style="font-size:0.875rem;color:var(--text-muted);">Showing ' + list.length + ' of ' + state.db.TICKET.length + ' tickets</span>' +

          '<div class="toolbar">' +
            '<div class="search-box">' + icon("search", 16) + '<input type="search" class="input" id="admin-search" placeholder="Search ticket ID, title, student, or location..." value="' + esc(state.searchQuery) + '" /></div>' +
            '<select class="select filter-select" id="admin-status-filter"><option value="All">All Statuses</option>' +

              ["Urgent", "High", "Medium", "Low"].map(function (p) {

              '<option value="sample"' + (state.recordTypeFilter === "sample" ? " selected" : "") + '>Sample Only</option>' +

      if (viewAll) viewAll.onclick = function () { state.activeTab = "tickets"; renderApp(); };

      var aSearch = document.getElementById("admin-search");
      if (aSearch) {
        aSearch.oninput = function () {
          state.searchQuery = aSearch.value;
          renderWorkspaceBody();
          var again = document.getElementById("admin-search");

        };

    /* Staff Workbench Views */
    function renderStaffTab(staff) {
      var myAssignments = state.db.ASSIGNMENT.filter(function (a) { return a.staff_id === staff.staff_id; })
        .sort(function (a, b) { return b.assignment_id - a.assignment_id; });
      var activeAssignments = myAssignments.filter(function (a) { return a.assignment_status !== "Reassigned"; });

      var assignedTickets = [];
      var seen = {};
      for (var i = 0; i < activeAssignments.length; i++) {
        var tk = getTicket(activeAssignments[i].ticket_id);
        if (tk && !seen[tk.ticket_id]) {
          seen[tk.ticket_id] = true;
          assignedTickets.push({ ticket: tk, assignment: activeAssignments[i] });
        }
      }

      if (state.activeTab === "history") {
        return (
          '<div class="page-head"><div><h1 class="page-title">Assignment History</h1><p class="page-subtitle">Complete chronological log of work orders assigned to ' + esc(staff.full_name) + '.</p></div></div>' +
          '<section class="panel">' +
            (myAssignments.length === 0
              ? '<div class="empty-state"><div class="empty-title">No assignment history</div><p class="empty-desc">Assigned service requests will appear here.</p></div>'
              : '<div class="table-wrap"><table><thead><tr><th>Assignment</th><th>Ticket &amp; Location</th><th>Admin Remarks</th><th>Your Work Remarks</th><th>Status</th><th class="num-col">Action</th></tr></thead><tbody>' +
                myAssignments.map(function (a) {
                  var tk = getTicket(a.ticket_id);
                  return (
                    '<tr>' +
                      '<td class="mono">ASN-' + a.assignment_id + '<span class="row-meta" style="display:block;font-family:var(--font-sans);">' + fmtDate(a.assigned_at) + '</span></td>' +
                      '<td><span class="row-title"><span class="mono">TKT-' + a.ticket_id + '</span> &middot; ' + esc(tk ? tk.title : "") + '</span><span class="row-meta">' + esc(tk ? tk.campus_location : "") + '</span></td>' +
                      '<td style="max-width:220px;">' + esc(a.admin_remarks || "—") + '</td>' +
                      '<td style="max-width:220px;">' + esc(a.staff_remarks || "No remarks logged yet") + '</td>' +
                      '<td>' + (tk ? statusHtml(tk.status) : esc(a.assignment_status)) + '</td>' +
                      '<td class="num-col"><button type="button" class="btn btn-secondary btn-sm" data-inspect-ticket="' + a.ticket_id + '">Open</button></td>' +
                    '</tr>'
                  );
                }).join("") +
                '</tbody></table></div>') +
          '</section>'
        );
      }

      var totalAssigned = assignedTickets.length;
      var pendingTasks = assignedTickets.filter(function (x) { return x.ticket.status === "Assigned" || x.ticket.status === "Pending"; }).length;
      var inProgressTasks = assignedTickets.filter(function (x) { return x.ticket.status === "In Progress"; }).length;
      var resolvedTasks = assignedTickets.filter(function (x) { return x.ticket.status === "Resolved"; }).length;

      var q = state.searchQuery.toLowerCase();
      var filtered = assignedTickets.filter(function (x) {
        if (state.statusFilter !== "All" && x.ticket.status !== state.statusFilter) return false;
        if (q) {
          var stud = getStudent(x.ticket.student_id);
          var hay = ("TKT-" + x.ticket.ticket_id + " " + x.ticket.title + " " + x.ticket.campus_location + " " + (stud ? stud.full_name : "")).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      return (
        '<div class="page-head">' +
          '<div><h1 class="page-title">Staff Workbench &middot; ' + esc(staff.full_name) + '</h1><p class="page-subtitle">' + esc(staff.designation) + ' &middot; Availability: ' + esc(staff.availability_status) + '</p></div>' +
        '</div>' +
        '<div class="kpi-grid">' +
          '<div class="kpi-card"><div class="kpi-label">Assigned Tickets</div><div class="kpi-value tabular">' + totalAssigned + '</div><div class="kpi-note">Total active &amp; completed</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Pending Tasks</div><div class="kpi-value tabular" style="color:var(--blue-700);">' + pendingTasks + '</div><div class="kpi-note">Awaiting work start</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">In Progress Tasks</div><div class="kpi-value tabular" style="color:#4338CA;">' + inProgressTasks + '</div><div class="kpi-note">Currently being serviced</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Resolved Tasks</div><div class="kpi-value tabular" style="color:var(--success);">' + resolvedTasks + '</div><div class="kpi-note">Completed work orders</div></div>' +
        '</div>' +
        '<section class="panel">' +
          '<div class="panel-header"><h2 class="panel-title">Assigned Complaints Queue</h2></div>' +
          '<div class="toolbar">' +
            '<div class="search-box">' + icon("search", 16) + '<input type="search" class="input" id="staff-search" placeholder="Search assigned ticket, location, or student..." value="' + esc(state.searchQuery) + '" /></div>' +
            '<select class="select filter-select" id="staff-status-filter">' +
              '<option value="All">All Statuses</option>' +
              '<option value="Assigned"' + (state.statusFilter === "Assigned" ? " selected" : "") + '>Assigned (Pending Start)</option>' +
              '<option value="In Progress"' + (state.statusFilter === "In Progress" ? " selected" : "") + '>In Progress</option>' +
              '<option value="Resolved"' + (state.statusFilter === "Resolved" ? " selected" : "") + '>Resolved</option>' +
            '</select>' +
          '</div>' +
          (filtered.length === 0
            ? '<div class="empty-state"><div class="empty-title">No assigned complaints found</div><p class="empty-desc">You have no tasks matching this filter.</p></div>'
            : '<div class="table-wrap"><table><thead><tr><th>Ticket &amp; Location</th><th>Student Contact</th><th>Priority</th><th>Status</th><th>Admin Remarks</th><th class="num-col">Work Order</th></tr></thead><tbody>' +
              filtered.map(function (x) {
                var t = x.ticket;
                var stud = getStudent(t.student_id);
                return (
                  '<tr>' +
                    '<td><span class="row-title"><span class="mono">TKT-' + t.ticket_id + '</span> &middot; ' + esc(t.title) + '</span><span class="row-meta">' + esc(t.campus_location) + ' &middot; ' + fmtDate(t.created_at) + '</span></td>' +
                    '<td><span>' + esc(stud ? stud.full_name : "—") + '</span><span class="row-meta" style="display:block;">' + esc(stud ? stud.phone + " · " + stud.roll_number : "") + '</span></td>' +
                    '<td>' + priorityHtml(t.priority) + '</td>' +
                    '<td>' + statusHtml(t.status) + '</td>' +
                    '<td style="max-width:220px;">' + esc(x.assignment.admin_remarks || "—") + '</td>' +
                    '<td class="num-col"><button type="button" class="btn btn-blue btn-sm" data-inspect-ticket="' + t.ticket_id + '">Update &amp; Resolve</button></td>' +
                  '</tr>'
                );
              }).join("") +
              '</tbody></table></div>') +
        '</section>'
      );
    }

    function bindStaffEvents() {
      var sSearch = document.getElementById("staff-search");
      if (sSearch) {
        sSearch.oninput = function () {
          state.searchQuery = sSearch.value;
          renderWorkspaceBody();
          var again = document.getElementById("staff-search");
          if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        };
      }
      var sFilter = document.getElementById("staff-status-filter");
      if (sFilter) sFilter.onchange = function () { state.statusFilter = sFilter.value; renderWorkspaceBody(); };
      bindTicketInspectButtons();
    }

    function bindTicketInspectButtons() {
      var btns = document.querySelectorAll("[data-inspect-ticket]");
      for (var i = 0; i < btns.length; i++) {
        (function (b) {
          b.onclick = function () {
            openTicketDrawer(Number(b.getAttribute("data-inspect-ticket")));
          };
        })(btns[i]);
      }
    }

    /* Ticket Detail & Action Slide-Over Drawer */
    function openTicketDrawer(ticketId) {
      state.drawerTicketId = ticketId;
      var t = getTicket(ticketId);
      if (!t) return;

      var stud = getStudent(t.student_id);
      var cat = getCategory(t.category_id);
      var dept = cat ? getDepartment(cat.dept_id) : null;
      var assignments = getTicketAssignments(t.ticket_id);
      var activeAssign = getActiveAssignment(t.ticket_id);
      var assignedStaff = activeAssign ? getStaff(activeAssign.staff_id) : null;
      var fb = getTicketFeedback(t.ticket_id);
      var role = state.session ? state.session.role : "";

      var stepOrder = ["Pending", "Assigned", "In Progress", "Resolved"];
      var curIdx = stepOrder.indexOf(t.status);
      var timelineHtml =
        '<div class="timeline">' +
          stepOrder.map(function (st, idx) {
            var cls = "tl-step";
            if (idx <= curIdx) cls += (t.status === "Resolved" && st === "Resolved") ? " resolved" : " done";
            return '<div class="' + cls + '">' + esc(st) + '</div>';
          }).join("") +
        '</div>';

      var roleSection = "";

      if (role === "student") {
        if (t.status === "Resolved") {
          if (fb) {
            roleSection =
              '<div class="panel" style="margin-top:18px;">' +
                '<div class="panel-header"><h4 class="panel-title">Your Submitted Feedback</h4><span class="mono" style="font-size:0.75rem;color:var(--text-muted);">FB-' + fb.feedback_id + '</span></div>' +
                '<div class="panel-body">' +
                  '<div style="color:#D97706;font-size:1.125rem;margin-bottom:6px;">' + "★".repeat(fb.rating) + "☆".repeat(5 - fb.rating) + ' <span class="tabular" style="font-size:0.875rem;color:var(--navy-900);font-weight:600;">(' + fb.rating + '/5)</span></div>' +
                  '<p style="font-size:0.875rem;color:var(--text-secondary);">' + esc(fb.comments) + '</p>' +
                  '<div class="row-meta" style="margin-top:8px;">Submitted on ' + fmtDateTime(fb.submitted_at) + '</div>' +
                '</div>' +
              '</div>';
          } else {
            roleSection =
              '<div class="panel" style="margin-top:18px;">' +
                '<div class="panel-header"><h4 class="panel-title">Submit Post-Resolution Feedback</h4></div>' +
                '<div class="panel-body">' +
                  '<form id="student-feedback-form">' +
                    '<div class="form-group" style="margin-bottom:12px;">' +
                      '<label class="label">Service Rating (1 to 5 Stars)</label>' +
                      '<div class="star-row" id="star-picker">' +
                        [1, 2, 3, 4, 5].map(function (n) {
                          return '<button type="button" class="star-btn filled" data-star-val="' + n + '" aria-label="Rate ' + n + ' stars">&#9733;</button>';
                        }).join("") +
                        '<span id="star-val-text" class="tabular" style="font-size:0.875rem;font-weight:600;margin-left:8px;color:var(--navy-900);">5 / 5</span>' +
                      '</div>' +
                      '<input type="hidden" id="fb-rating-input" value="5" />' +
                    '</div>' +
                    '<div class="form-group" style="margin-bottom:14px;">' +
                      '<label class="label" for="fb-comments">Feedback Comments</label>' +
                      '<textarea class="textarea" id="fb-comments" rows="3" required placeholder="Share how well the technician resolved your request..."></textarea>' +
                    '</div>' +
                    '<div id="fb-err" class="field-error" style="margin-bottom:8px;"></div>' +
                    '<button type="submit" class="btn btn-blue btn-sm">Submit Feedback</button>' +
                  '</form>' +
                '</div>' +
              '</div>';
          }
        } else {
          roleSection =
            '<div class="notice notice-info" style="margin-top:16px;">' +
              icon("clock", 16) +
              '<span>Feedback and star rating (1–5) unlock automatically once this ticket is marked <strong>Resolved</strong>.</span>' +
            '</div>';
        }
      } else if (role === "admin") {
        var staffOptions = state.db.STAFF.map(function (st) {
          var d = getDepartment(st.dept_id);
          var sel = activeAssign && activeAssign.staff_id === st.staff_id ? " selected" : "";
          return '<option value="' + st.staff_id + '"' + sel + '>' + esc(st.full_name) + ' (' + esc(d ? d.dept_code : "") + ' · ' + esc(st.availability_status) + ')</option>';
        }).join("");

        roleSection =
          '<div class="panel" style="margin-top:18px;">' +
            '<div class="panel-header"><h4 class="panel-title">Admin Assignment &amp; Status Control</h4></div>' +
            '<div class="panel-body">' +
              '<form id="admin-assign-form">' +
                '<div class="form-group" style="margin-bottom:12px;">' +
                  '<label class="label" for="adm-staff-select">Assign / Reassign Staff Member</label>' +
                  '<select class="select" id="adm-staff-select">' + staffOptions + '</select>' +
                '</div>' +
                '<div class="form-group" style="margin-bottom:12px;">' +
                  '<label class="label" for="adm-remarks">Assignment Remarks</label>' +
                  '<textarea class="textarea" id="adm-remarks" rows="2" placeholder="Instructions or diagnostic notes for the technician...">' + esc(activeAssign ? activeAssign.admin_remarks : "") + '</textarea>' +
                '</div>' +
                '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">' +
                  '<button type="submit" class="btn btn-blue btn-sm">Save Staff Assignment</button>' +
                '</div>' +
              '</form>' +
              '<div style="border-top:1px solid var(--border);padding-top:14px;">' +
                '<label class="label" for="adm-status-select" style="display:block;margin-bottom:6px;">Direct Ticket Status Override</label>' +
                '<div style="display:flex;gap:10px;align-items:center;">' +
                  '<select class="select" id="adm-status-select" style="flex:1;">' +
                    ["Pending", "Assigned", "In Progress", "Resolved"].map(function (s) {
                      return '<option value="' + s + '"' + (t.status === s ? " selected" : "") + '>' + s + '</option>';
                    }).join("") +
                  '</select>' +
                  '<button type="button" class="btn btn-secondary btn-sm" id="adm-update-status-btn">Update Status</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
      } else if (role === "staff") {
        roleSection =
          '<div class="panel" style="margin-top:18px;">' +
            '<div class="panel-header"><h4 class="panel-title">Technician Work Update</h4></div>' +
            '<div class="panel-body">' +
              '<form id="staff-work-form">' +
                '<div class="form-group" style="margin-bottom:12px;">' +
                  '<label class="label" for="stf-status-select">Work Order Status</label>' +
                  '<select class="select" id="stf-status-select">' +
                    ["Assigned", "In Progress", "Resolved"].map(function (s) {
                      return '<option value="' + s + '"' + (t.status === s ? " selected" : "") + '>' + s + '</option>';
                    }).join("") +
                  '</select>' +
                '</div>' +
                '<div class="form-group" style="margin-bottom:14px;">' +
                  '<label class="label" for="stf-remarks">Work Remarks / Resolution Notes</label>' +
                  '<textarea class="textarea" id="stf-remarks" rows="3" placeholder="Document inspection findings, parts replaced, or resolution summary...">' + esc(activeAssign ? activeAssign.staff_remarks : "") + '</textarea>' +
                '</div>' +
                '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
                  '<button type="submit" class="btn btn-blue btn-sm">Save Work Update</button>' +
                  (t.status !== "Resolved"
                    ? '<button type="button" class="btn btn-success btn-sm" id="stf-mark-resolved-btn">' + icon("check", 15) + '<span>Mark as Resolved</span></button>'
                    : '') +
                '</div>' +
              '</form>' +
            '</div>' +
          '</div>';
      }

      var historyHtml = "";
      if (assignments.length) {
        historyHtml =
          '<div style="margin-top:18px;">' +
            '<div class="label" style="margin-bottom:8px;">Assignment &amp; Remarks Log (' + assignments.length + ')</div>' +
            assignments.map(function (a) {
              var stf = getStaff(a.staff_id);
              var adm = getAdmin(a.admin_id);
              return (
                '<div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;background:var(--bg-subtle);font-size:0.8125rem;">' +
                  '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">' +
                    '<strong>' + esc(stf ? stf.full_name : "Staff") + ' (' + esc(a.assignment_status) + ')</strong>' +
                    '<span class="row-meta">' + fmtDateTime(a.assigned_at) + '</span>' +
                  '</div>' +
                  '<div style="color:var(--text-muted);margin-bottom:4px;">Assigned by: ' + esc(adm ? adm.full_name : "Admin") + '</div>' +
                  (a.admin_remarks ? '<div><strong>Admin Note:</strong> ' + esc(a.admin_remarks) + '</div>' : '') +
                  (a.staff_remarks ? '<div style="margin-top:4px;"><strong>Staff Work Note:</strong> ' + esc(a.staff_remarks) + '</div>' : '') +
                '</div>'
              );
            }).join("") +
          '</div>';
      }

      document.getElementById("drawer-root").innerHTML =
        '<div class="drawer-backdrop" id="drawer-backdrop">' +
          '<div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-ticket-title">' +
            '<div class="modal-head">' +
              '<div>' +
                '<div style="font-size:0.75rem;color:var(--text-muted);"><span class="mono">TKT-' + t.ticket_id + '</span> &middot; ' + recordOriginText(t) + '</div>' +
                '<h3 class="modal-title" id="drawer-ticket-title">' + esc(t.title) + '</h3>' +
              '</div>' +
              '<button type="button" class="btn-ghost" id="drawer-close-btn" aria-label="Close drawer">' + icon("x", 18) + '</button>' +
            '</div>' +
            '<div class="modal-body" style="flex:1;">' +
              '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">' +
                statusHtml(t.status) +
                '<span aria-hidden="true" style="color:var(--border-strong);">|</span>' +
                '<span>Priority: ' + priorityHtml(t.priority) + '</span>' +
                '<span aria-hidden="true" style="color:var(--border-strong);">|</span>' +
                '<span style="font-size:0.8125rem;color:var(--text-muted);">Submitted ' + fmtDateTime(t.created_at) + '</span>' +
              '</div>' +
              timelineHtml +
              '<p style="font-size:0.9375rem;color:var(--text-primary);margin-bottom:12px;">' + esc(t.description) + '</p>' +
              '<div class="detail-kv">' +
                '<div><div class="kv-label">Campus Location</div><div class="kv-val">' + esc(t.campus_location) + '</div></div>' +
                '<div><div class="kv-label">Category &amp; Dept</div><div class="kv-val">' + esc(cat ? cat.category_name : "—") + ' (' + esc(dept ? dept.dept_code : "") + ')</div></div>' +
                '<div><div class="kv-label">Student</div><div class="kv-val">' + esc(stud ? stud.full_name + " (" + stud.roll_number + ")" : "—") + '</div></div>' +
                '<div><div class="kv-label">Student Contact</div><div class="kv-val">' + esc(stud ? stud.phone + " · " + stud.email : "—") + '</div></div>' +
                '<div><div class="kv-label">Assigned Staff</div><div class="kv-val">' + esc(assignedStaff ? assignedStaff.full_name + " (" + assignedStaff.designation + ")" : "Unassigned") + '</div></div>' +
                '<div><div class="kv-label">Staff Contact</div><div class="kv-val">' + esc(assignedStaff ? assignedStaff.phone : "—") + '</div></div>' +
              '</div>' +
              roleSection +
              historyHtml +
            '</div>' +
          '</div>' +
        '</div>';

      document.getElementById("drawer-close-btn").onclick = closeDrawer;
      document.getElementById("drawer-backdrop").onclick = function (e) { if (e.target.id === "drawer-backdrop") closeDrawer(); };

      /* Bind Student Feedback Stars & Submit */
      var starBtns = document.querySelectorAll("[data-star-val]");
      if (starBtns.length) {
        for (var s = 0; s < starBtns.length; s++) {
          (function (btn) {
            btn.onclick = function () {
              var val = Number(btn.getAttribute("data-star-val"));
              document.getElementById("fb-rating-input").value = String(val);
              document.getElementById("star-val-text").textContent = val + " / 5";
              for (var m = 0; m < starBtns.length; m++) {
                var n = Number(starBtns[m].getAttribute("data-star-val"));
                starBtns[m].classList.toggle("filled", n <= val);
              }
            };
          })(starBtns[s]);
        }
      }
      var fbForm = document.getElementById("student-feedback-form");
      if (fbForm) {
        fbForm.onsubmit = function (e) {
          e.preventDefault();
          var rating = Number(document.getElementById("fb-rating-input").value);
          var comments = document.getElementById("fb-comments").value.trim();
          if (comments.length < 5) {
            document.getElementById("fb-err").textContent = "Please write a brief feedback comment (at least 5 characters).";
            return;
          }
          state.db.FEEDBACK.push({
            feedback_id: nextId(state.db.FEEDBACK, "feedback_id"),
            ticket_id: t.ticket_id,
            student_id: t.student_id,
            rating: rating,
            comments: comments,
            submitted_at: new Date().toISOString()
          });
          saveDB();
          showToast("Thank you! Feedback saved for TKT-" + t.ticket_id + ".", "success");
          openTicketDrawer(t.ticket_id);
          renderWorkspaceBody();
        };
      }

      /* Bind Admin Assign & Status Actions */
      var admAssignForm = document.getElementById("admin-assign-form");
      if (admAssignForm) {
        admAssignForm.onsubmit = function (e) {
          e.preventDefault();
          var staffId = Number(document.getElementById("adm-staff-select").value);
          var remarks = document.getElementById("adm-remarks").value.trim();
          var existing = getActiveAssignment(t.ticket_id);
          if (existing && existing.staff_id === staffId) {
            existing.admin_remarks = remarks;
          } else {
            if (existing) existing.assignment_status = "Reassigned";
            state.db.ASSIGNMENT.push({
              assignment_id: nextId(state.db.ASSIGNMENT, "assignment_id"),
              ticket_id: t.ticket_id,
              staff_id: staffId,
              admin_id: state.session.userId,
              assigned_at: new Date().toISOString(),
              admin_remarks: remarks,
              staff_remarks: "",
              assignment_status: "Active"
            });
          }
          if (t.status === "Pending") t.status = "Assigned";
          t.updated_at = new Date().toISOString();
          saveDB();
          showToast("Staff assignment saved for TKT-" + t.ticket_id + ".", "success");
          openTicketDrawer(t.ticket_id);
          renderApp();
        };
      }
      var admStatusBtn = document.getElementById("adm-update-status-btn");
      if (admStatusBtn) {
        admStatusBtn.onclick = function () {
          var nextSt = document.getElementById("adm-status-select").value;
          t.status = nextSt;
          t.updated_at = new Date().toISOString();
          if (nextSt === "Resolved") {
            t.resolved_at = new Date().toISOString();
            if (activeAssign) activeAssign.assignment_status = "Completed";
          } else {
            t.resolved_at = null;
          }
          saveDB();
          showToast("TKT-" + t.ticket_id + " status updated to " + nextSt + ".", "success");
          openTicketDrawer(t.ticket_id);
          renderApp();
        };
      }

      /* Bind Staff Work Update & Resolve */
      var stfWorkForm = document.getElementById("staff-work-form");
      if (stfWorkForm) {
        stfWorkForm.onsubmit = function (e) {
          e.preventDefault();
          var nextSt = document.getElementById("stf-status-select").value;
          var remarks = document.getElementById("stf-remarks").value.trim();
          if (activeAssign) {
            activeAssign.staff_remarks = remarks;
            activeAssign.assignment_status = nextSt === "Resolved" ? "Completed" : (nextSt === "In Progress" ? "In Progress" : "Active");
          }
          t.status = nextSt;
          t.updated_at = new Date().toISOString();
          t.resolved_at = nextSt === "Resolved" ? new Date().toISOString() : null;
          saveDB();
          showToast("Work update saved for TKT-" + t.ticket_id + ".", "success");
          openTicketDrawer(t.ticket_id);
          renderApp();
        };
      }
      var stfResolveBtn = document.getElementById("stf-mark-resolved-btn");
      if (stfResolveBtn) {
        stfResolveBtn.onclick = function () {
          var remarks = document.getElementById("stf-remarks").value.trim();
          openConfirmModal(
            "Mark Ticket Resolved",
            "Confirm TKT-" + t.ticket_id + " has been resolved? The student will then be able to submit feedback.",
            "Mark Resolved",
            "btn-success",
            function () {
              if (activeAssign) {
                if (remarks) activeAssign.staff_remarks = remarks;
                activeAssign.assignment_status = "Completed";
              }
              t.status = "Resolved";
              t.updated_at = new Date().toISOString();
              t.resolved_at = new Date().toISOString();
              saveDB();
              showToast("TKT-" + t.ticket_id + " marked as Resolved.", "success");
              openTicketDrawer(t.ticket_id);
              renderApp();
            }
          );
        };
      }
    }

    /* Admin CRUD Modals (Staff, Department, Service Category) */
    function openStaffModal(staffId) {
      var editing = staffId ? getStaff(staffId) : null;
      var deptOpts = state.db.DEPARTMENT.map(function (d) {
        return '<option value="' + d.dept_id + '"' + (editing && editing.dept_id === d.dept_id ? " selected" : "") + '>' + esc(d.dept_name) + '</option>';
      }).join("");

      document.getElementById("modal-root").innerHTML =
        '<div class="backdrop" id="crud-backdrop"><div class="modal" role="dialog" aria-modal="true">' +
          '<div class="modal-head"><h3 class="modal-title">' + (editing ? "Edit Staff Member" : "Add Demo Staff Member") + '</h3><button type="button" class="btn-ghost" id="crud-close">' + icon("x", 18) + '</button></div>' +
          '<form id="staff-crud-form"><div class="modal-body"><div class="form-grid">' +
            '<div class="form-group"><label class="label" for="stf-name">Full Name</label><input class="input" id="stf-name" required value="' + esc(editing ? editing.full_name : "") + '" /></div>' +
            '<div class="form-group"><label class="label" for="stf-code">Employee Code</label><input class="input" id="stf-code" required value="' + esc(editing ? editing.employee_code : "STF-" + (101 + state.db.STAFF.length)) + '" /></div>' +
            '<div class="form-group"><label class="label" for="stf-email">Email</label><input class="input" type="email" id="stf-email" required value="' + esc(editing ? editing.email : "") + '" /></div>' +
            '<div class="form-group"><label class="label" for="stf-phone">Phone</label><input class="input" id="stf-phone" required value="' + esc(editing ? editing.phone : "+1-555-0290") + '" /></div>' +
            '<div class="form-group"><label class="label" for="stf-dept">Department</label><select class="select" id="stf-dept">' + deptOpts + '</select></div>' +
            '<div class="form-group"><label class="label" for="stf-avail">Availability</label><select class="select" id="stf-avail">' +
              ["Available", "Busy", "On Leave"].map(function (a) { return '<option value="' + a + '"' + (editing && editing.availability_status === a ? " selected" : "") + '>' + a + '</option>'; }).join("") +
            '</select></div>' +
            '<div class="form-group form-full"><label class="label" for="stf-desig">Designation</label><input class="input" id="stf-desig" required value="' + esc(editing ? editing.designation : "") + '" /></div>' +
          '</div><div id="crud-err" class="field-error" style="margin-top:10px;"></div></div>' +
          '<div class="modal-foot"><button type="button" class="btn btn-secondary" id="crud-cancel">Cancel</button><button type="submit" class="btn btn-blue">Save Staff</button></div></form>' +
        '</div></div>';

      document.getElementById("crud-close").onclick = closeModal;

    function openCatModal(catId) {

          '<div class="modal-head"><h3 class="modal-title">' + (editing ? "Edit Service Category" : "Add Service Category") + '</h3><button type="button" class="btn-ghost" id="crud-close">' + icon("x", 18) + '</button></div>' +
          '<form id="cat-crud-form"><div class="modal-body"><div class="form-grid">' +
            '<div class="form-group form-full"><label class="label" for="cat-name">Category Name</label><input class="input" id="cat-name" required value="' + esc(editing ? editing.category_name : "") + '" /></div>' +
